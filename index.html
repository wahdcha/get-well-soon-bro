<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WOI, SEMBUH.</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at top, #302b63, transparent 45%),
        linear-gradient(135deg, #0f0c29, #302b63, #24243e);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
    transition: background 1s ease;
}

/* BINTANG */

.star {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: .7;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: .2;
    }

    to {
        opacity: 1;
    }
}

/* CONTAINER */

.container {
    width: 90%;
    max-width: 620px;
    text-align: center;
    padding: 30px 0;
    position: relative;
    z-index: 2;
}

/* JUDUL */

h1 {
    font-size: 50px;
    margin: 0 0 10px;

    text-shadow:
        0 0 10px rgba(255,255,255,.3),
        0 0 30px rgba(150,120,255,.4);
}

.subtitle {
    opacity: .75;
    margin-bottom: 25px;
}

/* CARD */

.card {
    background: rgba(255,255,255,.1);

    border: 1px solid rgba(255,255,255,.15);

    backdrop-filter: blur(15px);

    border-radius: 25px;

    padding: 30px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);

    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* MESSAGE */

.message {
    min-height: 80px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 18px;
    line-height: 1.6;

    margin-bottom: 25px;

    transition: .3s;
}

/* BUTTON */

button {
    border: none;

    border-radius: 15px;

    padding: 13px 18px;

    margin: 6px;

    color: white;

    background: rgba(255,255,255,.14);

    border: 1px solid rgba(255,255,255,.1);

    cursor: pointer;

    font-size: 15px;

    transition: .2s;
}

button:hover {
    transform: translateY(-3px) scale(1.04);

    background: rgba(255,255,255,.25);

    box-shadow:
        0 8px 20px rgba(0,0,0,.25);
}

button:active {
    transform: scale(.92);
}

/* PROGRESS */

.progress {
    margin-top: 30px;
}

.progress-text {
    font-size: 14px;
    opacity: .75;
}

.progress-bar {
    height: 10px;

    background: rgba(255,255,255,.12);

    border-radius: 20px;

    overflow: hidden;

    margin-top: 10px;
}

.progress-fill {
    width: 15%;
    height: 100%;

    background: white;

    border-radius: 20px;

    transition: width 1s ease;
}

/* FOOTER */

.footer {
    margin-top: 20px;

    opacity: .45;

    font-size: 13px;
}

/* HUJAN */

.rain {
    position: fixed;

    top: -30px;

    width: 2px;
    height: 25px;

    background: rgba(255,255,255,.5);

    animation: rainFall linear infinite;

    z-index: 1;
}

@keyframes rainFall {

    from {
        transform: translateY(-50px);
    }

    to {
        transform: translateY(110vh);
    }

}

/* SHAKE */

.shake {
    animation: shake .35s;
}

@keyframes shake {

    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }

}

/* HEART */

.heart {
    position: fixed;

    font-size: 25px;

    pointer-events: none;

    animation: heartUp 1.5s ease forwards;

    z-index: 10;
}

@keyframes heartUp {

    from {
        transform: translateY(0) scale(.5);
        opacity: 1;
    }

    to {
        transform: translateY(-120px) scale(1.4);
        opacity: 0;
    }

}
</style>
</head>

<body>

<!-- BINTANG -->
<div class="star" style="left:10%;top:15%"></div>
<div class="star" style="left:20%;top:35%"></div>
<div class="star" style="left:80%;top:20%"></div>
<div class="star" style="left:90%;top:50%"></div>
<div class="star" style="left:65%;top:75%"></div>
<div class="star" style="left:35%;top:80%"></div>
<div class="star" style="left:50%;top:12%"></div>
<div class="star" style="left:5%;top:70%"></div>

<div class="container">

    <h1>WOI, SEMBUH.</h1>

    <div class="subtitle">
        badan lu lagi error. jangan sok kuat.
    </div>

    <div class="card" id="card">

        <div class="message" id="message">

            minum obat, minum air, terus istirahat.
            kerjaan nggak bakal kabur.

        </div>


        <!-- TOMBOL -->

        <button onclick="obat()">
            💊 OBAT
        </button>

        <button onclick="peluk()">
            🫂 PELUK DARURAT
        </button>

        <button onclick="surat()">
            📄 SURAT PERINGATAN
        </button>

        <button onclick="hujan()">
            🌧️ MODE HUJAN
        </button>


        <!-- PROGRESS -->

        <div class="progress">

            <div class="progress-text" id="progressText">

                tingkat kesembuhan: 15%

            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="progressFill">
                </div>

            </div>

        </div>

    </div>

    <div class="footer">

        dibuat khusus buat manusia yang keras kepala
        tapi harus sembuh.

    </div>

</div>


<script>

/* =========================
   SOUND EFFECT
========================= */

let audioContext;


/* bikin audio context setelah user klik */

function getAudio() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

    }

    return audioContext;

}


/* SOUND KLIK */

function clickSound() {

    const ctx = getAudio();

    const osc = ctx.createOscillator();

    const gain = ctx.createGain();

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.frequency.value = 700;

    gain.gain.setValueAtTime(
        0.08,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.12
    );

    osc.start();

    osc.stop(
        ctx.currentTime + 0.12
    );

}


/* SOUND OBAT */

function medicineSound() {

    const ctx = getAudio();

    const osc = ctx.createOscillator();

    const gain = ctx.createGain();

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.type = "sine";

    osc.frequency.setValueAtTime(
        500,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        900,
        ctx.currentTime + .2
    );

    gain.gain.setValueAtTime(
        .12,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + .35
    );

    osc.start();

    osc.stop(
        ctx.currentTime + .35
    );

}


/* SOUND PELUK */

function hugSound() {

    const ctx = getAudio();

    const osc = ctx.createOscillator();

    const gain = ctx.createGain();

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.type = "sine";

    osc.frequency.value = 220;

    gain.gain.setValueAtTime(
        .001,
        ctx.currentTime
    );

    gain.gain.linearRampToValueAtTime(
        .12,
        ctx.currentTime + .15
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + .7
    );

    osc.start();

    osc.stop(
        ctx.currentTime + .7
    );

}


/* SOUND SURAT */

function warningSound() {

    const ctx = getAudio();

    const osc = ctx.createOscillator();

    const gain = ctx.createGain();

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.type = "square";

    osc.frequency.value = 180;

    gain.gain.setValueAtTime(
        .07,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + .25
    );

    osc.start();

    osc.stop(
        ctx.currentTime + .25
    );

}


/* =========================
   SUARA HUJAN
========================= */

let rainAudio;

function startRainSound() {

    const ctx = getAudio();

    if (rainAudio) return;

    const bufferSize =
        2 * ctx.sampleRate;

    const buffer =
        ctx.createBuffer(
            1,
            bufferSize,
            ctx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for (
        let i = 0;
        i < bufferSize;
        i++
    ) {

        data[i] =
            Math.random() * 2 - 1;

    }

    rainAudio =
        ctx.createBufferSource();

    const filter =
        ctx.createBiquadFilter();

    const gain =
        ctx.createGain();

    rainAudio.buffer = buffer;

    rainAudio.loop = true;

    filter.type = "lowpass";

    filter.frequency.value = 4500;

    gain.gain.value = .045;

    rainAudio
        .connect(filter)
        .connect(gain)
        .connect(ctx.destination);

    rainAudio.start();

}


/* =========================
   BUTTON FUNCTIONS
========================= */

const message =
    document.getElementById("message");

const card =
    document.getElementById("card");

const progressFill =
    document.getElementById("progressFill");

const progressText =
    document.getElementById("progressText");


function obat() {

    medicineSound();

    message.innerText =
        "💊 MINUM OBAT. jangan nunggu badan lu bikin pengumuman resmi.";

    card.classList.remove("shake");

    void card.offsetWidth;

    card.classList.add("shake");

    progressFill.style.width = "35%";

    progressText.innerText =
        "tingkat kesembuhan: 35%";

}


/* PELUK */

function peluk() {

    hugSound();

    message.innerText =
        "🫂 sini diem. peluk darurat dikirim. jangan banyak protes.";

    createHearts();

}


/* SURAT */

function surat() {

    warningSound();

    message.innerText =
        "📄 SURAT PERINGATAN: dilarang keras maksa kerja saat badan lagi sakit.";

    card.classList.remove("shake");

    void card.offsetWidth;

    card.classList.add("shake");

}


/* HUJAN */

let raining = false;

function hujan() {

    clickSound();

    raining = !raining;

    if (raining) {

        document.body.style.background =
            "linear-gradient(135deg, #111827, #1e293b, #0f172a)";

        message.innerText =
            "🌧️ mode hujan aktif. sekarang rebahan dan jangan banyak gaya.";

        startRainSound();

        createRain();

    } else {

        document.body.style.background =
            "radial-gradient(circle at top, #302b63, transparent 45%), linear-gradient(135deg, #0f0c29, #302b63, #24243e)";

        message.innerText =
            "☁️ hujannya dimatiin. tapi lu tetep harus istirahat.";

        stopRain();

    }

}


/* =========================
   HUJAN VISUAL
========================= */

function createRain() {

    for (
        let i = 0;
        i < 80;
        i++
    ) {

        const drop =
            document.createElement("div");

        drop.className = "rain";

        drop.style.left =
            Math.random() * 100 + "%";

        drop.style.animationDuration =
            (.4 + Math.random() * .8) + "s";

        drop.style.animationDelay =
            Math.random() * 2 + "s";

        document.body.appendChild(drop);

    }

}


function stopRain() {

    document
        .querySelectorAll(".rain")
        .forEach(drop => drop.remove());

}


/* =========================
   HEART EFFECT
========================= */

function createHearts() {

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.innerText = "🫂";

        heart.style.left =
            (40 + Math.random() * 20) + "%";

        heart.style.top =
            (50 + Math.random() * 10) + "%";

        heart.style.animationDelay =
            Math.random() * .4 + "s";

        document.body.appendChild(heart);

        setTimeout(
            () => heart.remove(),
            1800
        );

    }

}

</script>

</body>
</html>
